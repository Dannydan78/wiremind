<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>WireMind</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
      .explanation {
        position: fixed; left: 16px; right: 16px; bottom: 16px;
        max-width: 720px; margin: 0 auto; padding: 12px 16px;
        border-radius: 8px; background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0; font: 15px/1.5 system-ui, sans-serif;
        white-space: pre-line;
      }
      .label-layer { position: fixed; inset: 0; pointer-events: none; }
      .machine-label {
        display: flex; flex-direction: column; align-items: center;
        padding: 4px 8px; border-radius: 6px;
        background: rgba(15, 23, 42, 0.75); color: #e2e8f0;
        font: 12px/1.4 ui-monospace, monospace;
        transform: translateY(-24px);
      }
      .machine-label strong { font: 600 13px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
